[package]
name = "tunly"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight, self-hosted HTTP tunnel for exposing local applications to the internet."
repository = "https://github.com/0xReLogic/Tunly"
homepage = "https://github.com/0xReLogic/Tunly"
documentation = "https://docs.rs/tunly"
readme = "../README.md"
keywords = ["tunnel", "http", "proxy", "self-hosted", "localhost"]
categories = ["network-programming", "command-line-utilities", "web-programming"]
autobins = false


[[bin]]
name = "tunly-client"
path = "src/bin/tunly-client.rs"

[[bin]]
name = "tunly-server"
path = "src/bin/tunly-server.rs"

[[bin]]
name = "tunly"
path = "src/bin/tunly.rs"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["trace", "normalize-path"] }
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
futures = "0.3.32"
rustls-acme = { version = "0.15.4", default-features = false, features = ["axum", "ring", "tls12", "tokio", "webpki-roots"] }
hyper = { version = "1.9.0", features = ["http1", "http2", "client", "server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
libc = "0.2"
flate2 = "1.1.9"
prometheus = "0.14.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tokio = { version = "1.51.1", features = ["full"] }
thiserror = "2.0.18"
urlencoding = "2.1.3"
rand = "0.10.1"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
http2 = []

# Platform-specific TLS backends
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.2", features = ["json", "gzip", "brotli", "deflate", "native-tls", "http2"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.1", features = ["json", "gzip", "brotli", "deflate", "http2"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
openssl = { version = "0.10.77", features = ["vendored"] }

# Balanced release profile - fast compile + reasonable size
[profile.release]
# Optimize for balance (2 = good optimization, faster compile than z)
opt-level = 2

# Enable Link Time Optimization (thin = faster compile than fat)
lto = "thin"

# 16 codegen units = good middle ground (faster than 1)
codegen-units = 16

# Keep symbols for debugging but smaller
strip = false

# Abort on panic
panic = "abort"

# Size optimization for dependencies only if needed
[profile.release.package."*"]
opt-level = 2

[dev-dependencies]
axum-test = "20.0.0"
