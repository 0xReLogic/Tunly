name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Rust crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Run tests
        working-directory: ./backend
        run: cargo test --all-targets --all-features

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy --all-targets --all-features -- -D warnings

  create-release:
    name: Create Release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Tunly ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## Tunly Release ${{ steps.get_version.outputs.version }}
            
            ### Downloads
            Download the appropriate binary for your platform below.
            
            ### Quick Start Guide
            
            #### Hosting your own Server (VPS)
            ```bash
            ./tunly-server --bind 0.0.0.0:8080
            ```
            
            #### Exposing Local App (Client)
            ```bash
            ./tunly-client --remote-host <vps-ip>:8080 --local 127.0.0.1:3000
            ```
            
            ### Usage Notes
            - Server: Run with `--internal-key` to protect the token endpoint.
            - Client: Use `--token-url` or enter the token manually when prompted.
            - Documentation: See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full configuration.

            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

  build-rust:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tunly-linux-x86_64
            use_cross: false
          
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: tunly-linux-aarch64
            use_cross: true
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tunly-macos-x86_64
            use_cross: false
          
          # macOS ARM64 (M1/M2)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tunly-macos-aarch64
            use_cross: false
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tunly-windows-x86_64
            use_cross: false
          
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: tunly-windows-aarch64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential
          
          # Install ARM64 cross-compile dependencies if needed
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: cargo install cross

      - name: Build release binary
        working-directory: ./backend
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Install UPX (optional compression)
        if: runner.os != 'macOS'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            wget https://github.com/upx/upx/releases/download/v4.2.2/upx-4.2.2-amd64_linux.tar.xz
            tar xf upx-4.2.2-amd64_linux.tar.xz
            sudo mv upx-4.2.2-amd64_linux/upx /usr/local/bin/
          elif [ "${{ runner.os }}" = "Windows" ]; then
            choco install upx -y
          fi
        shell: bash
        continue-on-error: true

      - name: Compress binaries with UPX
        if: runner.os != 'macOS'
        working-directory: ./backend/target/${{ matrix.target }}/release
        run: |
          if command -v upx &> /dev/null; then
            if [ "${{ runner.os }}" = "Windows" ]; then
              upx --best --lzma tunly-client.exe tunly-server.exe || true
            else
              upx --best --lzma tunly-client tunly-server || true
            fi
          fi
        shell: bash
        continue-on-error: true

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cd backend/target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact_name }}.tar.gz tunly tunly-client tunly-server
          mv ${{ matrix.artifact_name }}.tar.gz ${{ github.workspace }}/

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cd backend/target/${{ matrix.target }}/release
          7z a ${{ matrix.artifact_name }}.zip tunly.exe tunly-client.exe tunly-server.exe
          move ${{ matrix.artifact_name }}.zip ${{ github.workspace }}/
        shell: cmd

      - name: Upload Release Asset (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ./${{ matrix.artifact_name }}.tar.gz

      - name: Upload Release Asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ./${{ matrix.artifact_name }}.zip

  publish-crate:
    name: Publish crate to crates.io
    needs: [build-rust, package-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required to publish tunly." >&2
            exit 1
          fi

      - name: Publish tunly crate
        working-directory: ./backend
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

  package-macos-universal:
    name: Package macOS Universal Binary
    needs: [create-release, build-rust]
    runs-on: macos-latest
    steps:
      - name: Download architecture-specific binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p artifacts arm64 x86_64 universal
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern 'tunly-macos-aarch64.tar.gz' \
            --pattern 'tunly-macos-x86_64.tar.gz' \
            --dir artifacts
          tar xzf artifacts/tunly-macos-aarch64.tar.gz -C arm64
          tar xzf artifacts/tunly-macos-x86_64.tar.gz -C x86_64

      - name: Create universal binaries
        run: |
          lipo -create arm64/tunly-client x86_64/tunly-client -output universal/tunly-client
          lipo -create arm64/tunly-server x86_64/tunly-server -output universal/tunly-server
          lipo -create arm64/tunly x86_64/tunly -output universal/tunly
          lipo -info universal/tunly-client
          lipo -info universal/tunly-server
          lipo -info universal/tunly
          tar czf tunly-macos-universal.tar.gz -C universal tunly tunly-client tunly-server

      - name: Upload universal macOS asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ./tunly-macos-universal.tar.gz

  homebrew-formula:
    name: Generate Homebrew formula
    needs: [create-release, package-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Generate formula from release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern 'tunly-macos-universal.tar.gz' \
            --dir .
          SHA256=$(sha256sum tunly-macos-universal.tar.gz | cut -d' ' -f1)
          RELEASE_VERSION="${VERSION#v}"
          cat > tunly.rb <<EOF
          class Tunly < Formula
            desc "Lightweight, self-hosted HTTP tunnel"
            homepage "https://github.com/${{ github.repository }}"
            version "${RELEASE_VERSION}"
            url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/tunly-macos-universal.tar.gz"
            sha256 "${SHA256}"

            def install
              bin.install "tunly", "tunly-client", "tunly-server"
            end
          end
          EOF

      - name: Upload Homebrew formula
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ./tunly.rb

  publish-release:
    name: Publish GitHub Release
    needs: [create-release, build-rust, package-macos-universal, publish-crate, homebrew-formula]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: gh release edit "$VERSION" --repo "${{ github.repository }}" --draft=false
